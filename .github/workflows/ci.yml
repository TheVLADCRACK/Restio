name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high --omit=dev
      - name: Build
        run: npm run build
        env:
          # Valeurs factices : le build ne doit jamais avoir besoin de vrais secrets.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          PROD_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          ADMIN_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEON_AUTH_BASE_URL: https://auth.example.invalid/neondb/auth
          NEON_AUTH_COOKIE_SECRET: ci-only-cookie-secret-not-used-anywhere-0000
          ADMIN_ALLOWED_EMAILS: ci@example.invalid
          ROOT_HOST: localhost:3000
          APP_HOST: app.localhost:3000
